# Ember Sentinel — 엣지 IoT 설정 파일
# 환경에 맞게 수정하여 사용

server:
  api_url: "http://localhost:8080"
  fire_event_endpoint: "/embedded/fire-event/publish"

livekit:
  url: "ws://localhost:7880"

device:
  uuid: "cam-uuid-001"
  api_key: "dev-api-key-001"  # 서버에 등록된 카메라의 API Key

ble:
  arduino_mac: "90:9F:4D:1A:35:A1"
  characteristic_uuid: "12345678-1234-5678-1234-56789abcdef1"

yolo:
  model_path: "./experiments/yolov11n/weights/best_ncnn_model"
  confidence: 0.4
  image_size: 640

camera:
  index: 0
  width: 640
  height: 480

stream:
  max_duration: 30
  restart_delay: 60
  alert_cooldown: 10

logging:
  level: "INFO"                    # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/edge-iot.log"        # 로그 파일 경로
  max_bytes: 5242880               # 파일 최대 크기 (5MB)
  backup_count: 3                  # 로테이션 백업 파일 수

retry:
  max_attempts: 3                  # API 호출 최대 재시도 횟수
  base_delay: 1.0                  # 재시도 기본 대기 시간 (초)
  max_delay: 10.0                  # 재시도 최대 대기 시간 (초)
